{% extends "base.html" %}
{% block content %}
<section class="card narrow">
    <h1>New local quote</h1>
    <form method="post" action="/quotes" class="form-stack">
        <label>Quote title <input name="title" required placeholder="Example: Smith backyard planting"></label>
        <label>QBO customer
            <select name="customer_qbo_id"><option value="">Manual / not selected</option>{% for customer in customers %}<option value="{{ customer.qbo_id }}">{{ customer.display_name }}</option>{% endfor %}</select>
        </label>
        <label>Manual customer name <input name="customer_name_manual" placeholder="Use if customer is not cached"></label>
        <button class="button primary" type="submit">Create Quote</button>
    </form>
</section>
{% endblock %}
