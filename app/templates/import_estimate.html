{% extends "base.html" %}
{% block content %}
<section class="card narrow">
    <h1>Import QBO estimate by number</h1>
    <p>Use this for older estimates or one-off lookups that are not in the current-year library.</p>
    <form method="post" action="/qbo/import-estimate" class="form-stack">
        <label>Estimate # or QBO ID
            <input name="estimate_identifier" required placeholder="Example: 26158-P">
        </label>
        <button class="button primary" type="submit" {% if not qbo.connected %}disabled{% endif %}>Import Estimate</button>
    </form>
</section>
{% endblock %}
